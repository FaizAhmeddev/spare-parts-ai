[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spareai"
version = "1.0.0"
description = "AI-driven spare parts inventory optimisation: what to stock, reorder and clear"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
  "Flask>=3.0",
  "click>=8.1",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.0"]
sql = ["sqlalchemy>=2.0"]
server = ["waitress>=3.0"]
dev = ["pytest>=7"]
all = ["lightgbm>=4.0", "sqlalchemy>=2.0", "waitress>=3.0", "pytest>=7"]

[project.scripts]
spareai = "spareai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spareai = ["web/templates/*.html", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
